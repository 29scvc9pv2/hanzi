<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hànzì">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f3ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Hànzì</title>
<style>
:root{
  --bg:#f7f3ea;--card:#fffdf8;--ink:#1f1b16;--muted:#7a7064;--line:#e7dfd0;--soft:#efe8da;
  --accent:#b8322a;--accent-ink:#fff;--ok:#2f8f4e;--warn:#c98a12;--bad:#c0392b;--outline:#ddd3c1;
  --t1:#d6402f;--t2:#2f9a52;--t3:#2f6fd6;--t4:#8e44ad;--t5:#8a8378;
  --hz:"Kaiti SC","STKaiti","KaiTi","Songti SC","STSong","PingFang SC","Noto Serif CJK SC",serif;
  --radius:18px;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15130f;--card:#1f1c17;--ink:#f1ebe0;--muted:#a39888;--line:#2f2a22;--soft:#29251e;
  --accent:#e05a47;--outline:#5a5246;--t1:#ff6b5b;--t2:#4cc271;--t3:#5b9bff;--t4:#c07ae0;--t5:#9a9184;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.hz{font-family:var(--hz);font-weight:400}
#view{padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 96px);max-width:560px;margin:0 auto}
h1{font-size:30px;margin:4px 0 2px;letter-spacing:-.02em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 4px 8px;font-weight:600}
.sub{color:var(--muted);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;
  background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:17px;padding:0 18px}
.btn:active{transform:scale(.98);opacity:.9}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.small{min-height:40px;font-size:15px;width:auto}
.btn[disabled]{opacity:.45}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--soft);font-size:14px}
.muted{color:var(--muted)}
.big-num{font-size:34px;font-weight:700;letter-spacing:-.02em}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
.notone .t1,.notone .t2,.notone .t3,.notone .t4,.notone .t5{color:inherit}
.preview{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.preview span{font-size:34px;width:56px;height:56px;display:grid;place-items:center;border-radius:12px;background:var(--soft)}
/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;
  padding:8px 8px calc(var(--sab) + 6px);background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:10}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);min-width:80px;padding:4px}
.tabbar button .ic{font-family:var(--hz);font-size:24px;line-height:1.1}
.tabbar button.on{color:var(--accent)}
/* overlays */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;
  padding-top:var(--sat);animation:up .25s ease}
.overlay.hidden{display:none}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.ohead{display:flex;align-items:center;gap:12px;padding:10px 16px}
.x{width:44px;height:44px;flex:none;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:18px}
.obody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(var(--sab) + 20px);max-width:560px;width:100%;margin:0 auto}
.ofoot{padding:10px 16px calc(var(--sab) + 12px);max-width:560px;width:100%;margin:0 auto}
/* character display */
.stage{text-align:center;padding-top:6px}
.glyph{font-size:120px;line-height:1.1;margin:4px 0}
.pinyin{font-size:28px;font-weight:600;letter-spacing:.02em}
.meaning{font-size:20px;margin:4px 0 0}
.speak{width:44px;height:44px;border-radius:50%;background:var(--soft);display:inline-grid;place-items:center;font-size:20px;vertical-align:middle}
.writer{margin:8px auto;border-radius:16px;background:var(--card);border:1px solid var(--line);touch-action:none;position:relative;overflow:hidden;
  width:min(300px,78vw);aspect-ratio:1;transition:border-color .15s,box-shadow .15s}
.writer.lg{width:min(340px,86vw)}
.writer.err{border-color:var(--bad);box-shadow:0 0 0 3px rgba(192,57,43,.25)}
.gw{width:150px;height:150px;margin:6px auto}
.writer svg.grid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.writer>div,.writer>svg:not(.grid){position:relative}
.hint{text-align:center;color:var(--muted);font-size:15px;min-height:22px;margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border-radius:12px;background:var(--soft);font-size:15px}
.chip b{font-family:var(--hz);font-size:22px;font-weight:400}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:6px}
.word{display:flex;align-items:center;gap:12px}
.word .hz{font-size:30px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{border-radius:14px;padding:10px 4px;background:var(--soft);font-weight:600;font-size:15px;display:flex;flex-direction:column;align-items:center}
.grades button small{font-weight:400;color:var(--muted);font-size:12px}
.grades .sug{box-shadow:inset 0 0 0 2px currentColor}
.grades .g1{color:var(--bad)}.grades .g2{color:var(--warn)}.grades .g3{color:var(--ok)}.grades .g4{color:var(--t3)}
.opts{display:grid;gap:10px}
.opt{padding:16px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);text-align:left;font-size:17px}
.opt.right{border-color:var(--ok);background:rgba(47,143,78,.14);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.opt.wrong{border-color:var(--bad);background:rgba(192,57,43,.12);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.opts.hz4{grid-template-columns:1fr 1fr}
.opts.hz4 .opt{font-family:var(--hz);font-size:44px;text-align:center;padding:10px}
.progress{flex:1}
.steps{display:flex;gap:6px;justify-content:center;margin:2px 0 8px}
.steps i{width:28px;height:4px;border-radius:9px;background:var(--soft)}
.steps i.on{background:var(--accent)}
/* collection */
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:8px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.tile{aspect-ratio:1;border-radius:14px;background:var(--card);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center}
.tile .hz{font-size:30px;line-height:1.1}
.tile small{font-size:11px;color:var(--muted)}
.tile.new{border-style:dashed;opacity:.6}
.tile.learning{border-color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.tile.mastered{border-color:var(--ok);background:rgba(47,143,78,.08);background:color-mix(in srgb,var(--ok) 8%,var(--card))}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin:10px 4px}
/* settings */
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;border-radius:50%;background:var(--soft);font-size:20px}
.switch{width:52px;height:32px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.switch.on{background:var(--ok)}.switch.on::after{left:23px}
input[type=range]{width:140px;accent-color:var(--accent)}
.tones{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center}
.tones button{background:var(--soft);border-radius:14px;padding:10px 2px}
.tones .hz{font-size:30px;display:block}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 90px);transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:15px;z-index:50;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.center{text-align:center}
.done-emoji{font-size:64px;margin:30px 0 4px}
.small{font-size:13px}
a{color:var(--accent)}
</style>
</head>
<body>
<main id="view"></main>
<nav class="tabbar" id="tabbar">
  <button data-tab="today" class="on"><span class="ic">今</span>Aujourd'hui</button>
  <button data-tab="collection"><span class="ic">字</span>Collection</button>
  <button data-tab="settings"><span class="ic">设</span>Réglages</button>
</nav>
<section id="overlay" class="overlay hidden" aria-modal="true"></section>
<div id="toast" class="toast"></div>
<script src="hanzi-writer.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
